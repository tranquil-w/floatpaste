name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/*release*
      - packaging/**
      - crates/floatpaste-native/tests/e2e_smoke.rs
  # 手动运行只验收、上传工作流产物，不创建或公开 Release。
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: 测试交付产物并自动发布
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'release-notes' || 'release-preview' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      FLOATPASTE_E2E_STRICT: "1"
      FLOATPASTE_E2E_KEEP: "1"
    steps:
      - name: 拉取完整历史
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 校验版本与发布目标
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          NATIVE=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' crates/floatpaste-native/Cargo.toml | head -1 | tr -d '\r')
          test "$VERSION" = "$NATIVE"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
            git merge-base --is-ancestor HEAD origin/main
            if gh release view "$GITHUB_REF_NAME" --json isDraft > existing-release.json 2>/dev/null; then
              node -e "if (!require('./existing-release.json').isDraft) throw Error('禁止覆盖已经公开的 Release')"
            fi
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 检查发布说明脚本
        run: node --test scripts/release-notes.test.mjs

      - name: Rust 测试（禁止跳过主要 E2E）
        run: cargo test --locked -p floatpaste-core -p floatpaste-native -- --nocapture

      - name: 构建发布程序
        run: cargo build --locked --release -p floatpaste-native

      - name: 编译安装包并打包便携版
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$RELEASE_VERSION"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          # Git Bash 的 /D 参数必须关闭路径转换。
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion="$VERSION" packaging/floatpaste.iss
          STAGE="tmp/portable"
          mkdir -p "$STAGE" tmp/assets
          cp target/release/floatpaste.exe "$STAGE/floatpaste.exe"
          node scripts/render-release-notes.mjs "$VERSION" "$(date +%F)" - "$STAGE/README-使用说明.md" --template docs/release/usage-template.md
          powershell -NoProfile -Command "Compress-Archive -Path 'tmp/portable/*' -DestinationPath 'tmp/assets/FloatPaste-v${VERSION}-windows-x64-portable.zip' -Force"
          cp "packaging/output/FloatPaste_${VERSION}_x64-setup.exe" tmp/assets/
          (cd tmp/assets && sha256sum --binary *.exe *.zip > SHA256SUMS.txt)

      - name: 安装、便携运行与卸载验收
        shell: pwsh
        run: ./scripts/test-release.ps1 -Version $env:RELEASE_VERSION

      - name: 生成面向用户的发布说明
        env:
          RELEASE_NOTES_API_KEY: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && secrets.RELEASE_NOTES_API_KEY || '' }}
          RELEASE_NOTES_API_URL: ${{ vars.RELEASE_NOTES_API_URL }}
          RELEASE_NOTES_MODEL: ${{ vars.RELEASE_NOTES_MODEL }}
        run: node scripts/generate-release-notes.mjs $env:RELEASE_VERSION tmp/release-body.md

      - name: 保存产物、说明与验收日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            tmp/assets/*
            tmp/release-body.md
            ${{ runner.temp }}/floatpaste-e2e-*/com.floatpaste/logs/*
            ${{ runner.temp }}/floatpaste-e2e-search-*/com.floatpaste/logs/*
            ${{ runner.temp }}/floatpaste-release-*/install.log

      - name: 上传、下载核验并公开 Release
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$RELEASE_VERSION"
          FLAGS=(--prerelease=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            FLAGS=(--prerelease --latest=false)
          fi
          if gh release view "$TAG" --json isDraft > existing-release.json 2>/dev/null; then
            node -e "if (!require('./existing-release.json').isDraft) throw Error('禁止覆盖已经公开的 Release')"
            gh release edit "$TAG" --notes-file tmp/release-body.md "${FLAGS[@]}"
          else
            gh release create "$TAG" --verify-tag --draft --title "FloatPaste $TAG" --notes-file tmp/release-body.md "${FLAGS[@]}"
          fi
          gh release upload "$TAG" tmp/assets/* --clobber
          mkdir -p tmp/downloaded
          gh release download "$TAG" --dir tmp/downloaded
          cmp tmp/assets/SHA256SUMS.txt tmp/downloaded/SHA256SUMS.txt
          (cd tmp/downloaded && sha256sum --check ../assets/SHA256SUMS.txt)
          gh release view "$TAG" --json assets -q '.assets[].name' | sort > tmp/remote-assets.txt
          (cd tmp/assets && ls -1 | sort) > tmp/local-assets.txt
          diff -u tmp/local-assets.txt tmp/remote-assets.txt
          gh release edit "$TAG" --draft=false "${FLAGS[@]}"
          gh release view "$TAG" --json isDraft -q '.isDraft' | grep -x false
          echo "发布成功：https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 输出验收结果
        if: success()
        shell: bash
        run: |
          echo "版本 v$RELEASE_VERSION：源码测试、安装版与便携版 E2E、安装/卸载、程序哈希检查通过。" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "本次为发布演练；产物与发布说明保存在工作流 Artifact，不公开 Release。" >> "$GITHUB_STEP_SUMMARY"
          fi
