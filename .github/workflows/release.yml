name: Release

on:
  push:
    tags: ["v*"]

jobs:
  notes:
    name: 生成发布说明骨架
    runs-on: ubuntu-latest
    steps:
      - name: 拉取完整历史
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: git-cliff 提取本版变更
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest
        env:
          OUTPUT: cliff-latest.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 上传变更清单
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: cliff-latest.md

  release:
    name: 检查、构建并创建草稿 Release
    needs: notes
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 下载变更清单
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: 校验 tag 与仓库版本一致
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          NATIVE=$(grep -m1 '^version' crates/floatpaste-native/Cargo.toml | sed 's/^version *= *"\(.*\)".*/\1/' | tr -d '\r')
          echo "tag=${TAG} package=${PKG} native=${NATIVE}"
          test "${TAG}" = "${PKG}"
          test "${TAG}" = "${NATIVE}"

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Rust 测试
        run: cargo test -p floatpaste-core -p floatpaste-native --quiet

      - name: 渲染发布说明
        shell: bash
        run: |
          set -euo pipefail
          node scripts/render-release-notes.mjs "${GITHUB_REF_NAME#v}" "$(date +%F)" cliff-latest.md release-body.md
          {
            echo "RELEASE_BODY<<EB_${GITHUB_RUN_ID}"
            cat release-body.md
            echo "EB_${GITHUB_RUN_ID}"
          } >> "${GITHUB_ENV}"

      - name: 构建 Slint 壳
        run: cargo build --release -p floatpaste-native

      - name: 编译 Inno 安装包
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if command -v iscc >/dev/null 2>&1; then
            ISCC=iscc
          else
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          # Git Bash 会把 /D 参数当路径转换，必须禁用
          MSYS_NO_PATHCONV=1 "$ISCC" /DAppVersion="${VERSION}" packaging/floatpaste.iss

      - name: 创建草稿 Release 并上传安装包
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SETUP_EXE="packaging/output/FloatPaste_${VERSION}_x64-setup.exe"
          test -f "${SETUP_EXE}"
          # 重跑流水线时 Release 可能已存在，跳过创建
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || {
            PRERELEASE_FLAG=""
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file release-body.md ${PRERELEASE_FLAG}
          }
          gh release upload "${GITHUB_REF_NAME}" "${SETUP_EXE}" --clobber

      - name: 打包便携版并生成校验文件
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="tmp/portable/FloatPaste-v${VERSION}-windows-x64-portable"
          ZIP_NAME="FloatPaste-v${VERSION}-windows-x64-portable.zip"
          mkdir -p "${STAGE}"
          cp "target/release/floatpaste.exe" "${STAGE}/floatpaste.exe"
          node scripts/render-release-notes.mjs "${VERSION}" "$(date +%F)" - "${STAGE}/README-使用说明.md" --template docs/release/使用说明模板.md
          powershell -Command "Compress-Archive -Path 'tmp/portable/FloatPaste-v${VERSION}-windows-x64-portable/*' -DestinationPath 'tmp/${ZIP_NAME}' -Force"
          mkdir -p tmp/assets
          cp "tmp/${ZIP_NAME}" tmp/assets/
          cp packaging/output/FloatPaste_${VERSION}_x64-setup.exe tmp/assets/
          (cd tmp/assets && sha256sum --binary * > "../SHA256SUMS.txt")
          gh release upload "${GITHUB_REF_NAME}" "tmp/${ZIP_NAME}" "tmp/SHA256SUMS.txt" --clobber

      - name: 输出后续步骤
        shell: bash
        run: |
          {
            echo "## Release 草稿已就绪"
            echo ""
            echo "产物: Inno 安装包 + 便携版 zip + SHA256SUMS.txt（预发布版本号自动勾选 Pre-release）"
            echo "后续: 补充手动验证建议 → 本机验收 → \`gh release edit ${GITHUB_REF_NAME} --draft=false\` 正式发布"
          } >> "${GITHUB_STEP_SUMMARY}"
