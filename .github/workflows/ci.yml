name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，取消进行中的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 lint / 构建 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint 检查
        run: pnpm lint

      - name: Prettier 格式检查
        run: pnpm format:check

      - name: TypeScript 构建
        run: pnpm build

      - name: 前端单元测试
        run: pnpm test

  rust:
    name: Rust 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 运行 cargo test
        working-directory: src-tauri
        run: cargo test --verbose
