name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，取消进行中的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 统一检查（脚本、格式、严格 E2E 与 native 构建）
        shell: pwsh
        run: ./scripts/check.ps1

      - name: 保存检查报告与实例日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-checks
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .artifacts/checks/**
            ${{ runner.temp }}/floatpaste-e2e-*/floatpaste/logs/*
            ${{ runner.temp }}/floatpaste-e2e-search-*/floatpaste/logs/*
