name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，取消进行中的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 检查发布说明脚本
        run: node --test scripts/release-notes.test.mjs

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 运行 cargo test
        run: cargo test -p floatpaste-core -p floatpaste-native --verbose
