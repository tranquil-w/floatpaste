name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的并发运行只保留最新一次，取消进行中的旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 测试
    runs-on: windows-latest
    env:
      FLOATPASTE_E2E_STRICT: "1"
      FLOATPASTE_E2E_KEEP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 检查发布说明脚本
        run: node --test scripts/release-notes.test.mjs

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check

      - name: Rust 测试（禁止跳过主要 E2E）
        run: cargo test --locked -p floatpaste-core -p floatpaste-native -- --nocapture

      - name: 构建 native
        run: cargo build --locked -p floatpaste-native

      - name: 保存失败实例日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-e2e-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/floatpaste-e2e-*/floatpaste/logs/*
            ${{ runner.temp }}/floatpaste-e2e-search-*/floatpaste/logs/*
