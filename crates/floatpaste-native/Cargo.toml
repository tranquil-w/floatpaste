[package]
name = "floatpaste-native"
version = "0.10.2"
edition = "2021"

# 产物沿用旧壳二进制名 floatpaste.exe，便携版覆盖与用户感知路径保持一致
[[bin]]
name = "floatpaste"
path = "src/main.rs"

[dependencies]
arboard = "3.4.1"
floatpaste-core = { path = "../floatpaste-core" }
image = { version = "0.25.9", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde_json = "1"
slint = { version = "1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "raw-window-handle-06",
] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
# 仅测试用剪贴板原生 API（锁死探测）；与主依赖同版本，Cargo 对测试构建取 feature 并集
windows = { version = "0.62.2", features = ["Win32_System_DataExchange"] }

[build-dependencies]
embed-resource = "3"
slint-build = "1"
