[package]
name = "floatpaste-native"
version = "0.10.0-alpha.1"
edition = "2021"

# 产物沿用旧壳二进制名 floatpaste.exe，便携版覆盖与用户感知路径保持一致
[[bin]]
name = "floatpaste"
path = "src/main.rs"

[dependencies]
arboard = "3.4.1"
floatpaste-core = { path = "../floatpaste-core" }
image = { version = "0.25.9", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
serde_json = "1"
slint = { version = "1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "raw-window-handle-06",
] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
# SystemBackdrops(DesktopAcrylicController)自 22H1 SDK 起,windows 0.61 未收录,
# 独立引入 0.62 与 winit 依赖的 0.61 共存
windows62 = { package = "windows", version = "0.62.2", features = [
  "Foundation",
  "System",
  "UI_Composition",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
embed-resource = "3"
slint-build = "1"
