# git-cliff 配置：按 Conventional Commits 生成中文分组的发布说明
# CI 发版时以 `git-cliff --latest` 输出上一 tag 到当前 tag 的变更，注入 Release 草稿

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "新功能" },
  { message = "^fix", group = "修复" },
  { message = "^perf", group = "性能优化" },
  { message = "^refactor", group = "重构" },
  { message = "^doc|^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^chore|^ci|^style|^build|^release", skip = true },
  { message = ".*", group = "其他变更" },
]
